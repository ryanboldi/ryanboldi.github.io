<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/fonts/Serif/cmun-serif.css">
    <link rel="stylesheet" type="text/css" href="/blog/style.css">
    <style>body{font-family:'CMS','Computer Modern Serif',serif}</style>

  </head>
  <body>
    <header class="border-bottom" style="background:#111">
      <nav class="container py-3 d-flex justify-content-between align-items-center">
        <a href="/blog/" class="fs-5 fw-bold">Ryan's Blog</a>
        <div>
          <a href="/">Home</a>
          <a href="/blog/">All posts</a>
        </div>
      </nav>
    </header>

    <main>
      <article>
        <h1>{{TITLE}}</h1>
        <p class="post-date">{{DATE}}</p>

        <!-- Your content starts here -->
        {{CONTENT}}
        <!-- Your content ends here -->
      </article>
    </main>

    <footer class="text-center py-3 border-top" style="background:#111;color:#777">
      © 2025 Ryan Bahlous-Boldi
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
  </body>
</html>
